# Esquema de la ficha de proyecto — Criterio
# Contrato de datos entre el agente PM y el agente PMO.
#
# Este archivo es la ESPECIFICACIÓN, en YAML por legibilidad.
# Lo que se ALMACENA es JSON, en <estado>/records/<codigo>.json, con esta misma
# forma. Es JSON y no YAML porque leer YAML exigiría instalar PyYAML en el
# equipo del usuario, y scripts/pmo.py no tiene dependencias.
# Cada campo se guarda como {value, source, source_date, state}.
# state: found | not_found | ambiguous
# Un campo ambiguo lleva además un bloque `conflict` con la fuente que discrepa.

schema_version: "0.2"

# Cada campo se guarda como {value, source, source_date, state} y admite un quinto:
#
#   source_kind: evidence | declaration
#
# `evidence` es lo que sustenta un documento. `declaration` es lo que alguien afirma,
# incluido lo que llega importado de una herramienta corporativa de portafolio: el
# campo "estado: verde" de un PPM es la afirmacion del gerente con otra interfaz, no
# evidencia. Sin marca se asume evidencia. Contar una declaracion como evidencia es
# lo que rompe la comparacion el dia que se conecta una fuente de ese tipo.
#
# `source` es la ruta del documento RELATIVA A LA RAIZ DE DOCUMENTACION, no a la
# carpeta del proyecto. Es lo que permite que `pmo.py index` cruce lo que hay en disco
# contra lo que las fichas dicen haber leido con un solo join, y detecte una cita que
# dejo de resolver.

identity:
  code:                 # identificador estable del proyecto, no cambia nunca
  name:
  aliases: []           # otros nombres con que aparece en los documentos
  business_area:        # área o unidad dueña
  product:              # el producto al que sirve, si sirve a uno. Un producto vive
                        # varios proyectos y sobrevive a todos ellos: es la dimensión
                        # con la que la PMO mira el conjunto por producto y no por
                        # proyecto. Vacío es válido: no todo proyecto tiene producto.
  authority:            # hasta qué monto y qué cambio de alcance puede decidir el
                        # gerente sin subir a comité. Es el campo que falta en nueve
                        # de cada diez actas, y sin él el control de cambios no puede
                        # saber si algo excede la facultad sin releer el acta.
  sponsor:              # patrocinador
  manager:              # gerente de proyecto
  committee:            # a qué comité reporta
  phase:                # etapa declarada

declared:               # lo que AFIRMA el gerente de proyecto. Declaración, no evidencia.
  status:               # verde | amarillo | rojo, tal como él lo reporta
  progress_pct:
  as_of:                # fecha de la declaración
  source:

plan:
  start_date:
  end_date:             # fecha vigente
  baseline:             # append-only. Ver el skill baseline-variance.
    - version: 1
      approved_on:
      start_date:
      end_date:
      reason:           # por qué se aprobó esta línea base
      source:
  milestones:
    - name:
      baseline_date:
      current_date:
      state:            # pending | met | missed | unknown
      evidence:         # documento que prueba el cumplimiento, o vacío
      source:
  scope_summary:
  exclusions:           # lo que el proyecto declaró que NO hace

money:
  currency:
  approved:             # presupuesto aprobado
  committed:            # comprometido en contratos y órdenes
  executed:             # ejecutado
  projection:           # proyección al cierre, si algún documento la declara

vendors:
  - name:
    contract_ref:
    deliverables:
      - name:
        due_date:
        amount:         # valor del entregable, si el contrato lo declara. Sin esto,
                        # una factura contra un entregable que nunca empezo pasa
                        # desapercibida mientras haya otros aceptados.
        state:          # pending | delivered | accepted | late | unknown
        evidence:
    invoiced:
    source:

raid:                   # ver el skill raid-taxonomy
  risks: []             # {what, probability, impact, owner, due_date, last_moved, source}
  assumptions: []       # {what, verified, owner, source}
  issues: []            # {what, since, owner, source}
  dependencies:         # dependencias de OTROS proyectos, por código
    - on_project:       # el `code` del otro proyecto — así se cruza el portafolio
      what:
      needed_by:
      confirmed:        # false = declarada por este proyecto, no acordada con el otro
      source:

changes:                # solicitudes de cambio
  - ref:
    requested_on:
    scope_impact:
    time_impact:
    cost_impact:
    decision:           # approved | rejected | pending
    decided_by:
    source:

commitments:            # ver el skill commitment-tracking
  - who:
    what:
    due_date:           # `no_declarada` cuando nadie la dijo. No puede estar vencido,
                        # y por eso mismo se cuenta aparte: un compromiso que nadie
                        # fecho es un hallazgo, no un vacio.
    stated_on:
    source:             # la minuta o transcripción donde se dijo
    state:              # open | met | overdue | unknown
    reschedules:        # el mismo compromiso prometido de nuevo, con fecha nueva.
      - due_date:       # Tres veces no son tres compromisos vencidos: es uno con
        stated_on:      # historial, y un bloqueo que nadie ha nombrado.
        source:

activity:               # lo calcula el script a partir de los nombres de archivo
  last_document_date:
  last_meeting_date:
  days_silent:

meta:
  record_updated:       # cuándo se actualizó esta ficha
  documents_seen:       # lo leído, para no releer. Lo cruza `pmo.py index`.
    - path:             # relativa a la raíz de documentación
      hash:             # de los bytes: decide si vale la pena extraer el texto
      text_hash:        # del texto normalizado: decide si vale la pena releer.
                        # Un Word reguardado o un Excel que recalcula al abrirlo
                        # cambian el primero y no el segundo. Vacío cuando el formato
                        # no se puede leer sin dependencias.
      date:
  fields_not_found: []  # lista de campos en not_found, para el informe
  open_conflicts: []    # lista de campos en ambiguous
