name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  marketplace:
    name: Marketplace, plugins and doc consistency
    runs-on: ubuntu-latest
    steps:
      # Sin acciones de terceros: el repositorio solo admite acciones de josenanez. El repositorio
      # es público, así que el commit se trae sin token, y el Python es el del runner.
      - name: The commit under test
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          python3 --version
      - name: Validate the marketplace and every plugin
        run: python3 scripts/validate_plugins.py
