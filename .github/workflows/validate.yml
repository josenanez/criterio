name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  marketplace:
    name: Marketplace, plugins and doc consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the marketplace and every plugin
        run: python3 scripts/validate_plugins.py
