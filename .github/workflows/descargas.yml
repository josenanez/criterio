name: descargas

# Las descargas de Criterio, día por día (scripts/descargas.py). GitHub guarda solo los últimos
# catorce días de tráfico: este flujo los lee a diario y los suma al historial de la rama
# `descargas`, para que ningún día se pierda, con las estrellas y los forks de cada día. El tráfico
# necesita el secreto TRAFFIC_TOKEN, un token de grano fino con lectura de administración sobre
# este repositorio; lo crea quien lo administra. Sin él, el flujo guarda las estrellas y los forks y
# deja un aviso. Sin acciones de terceros: el repositorio solo admite acciones de josenanez; git y
# Python son los del runner.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: El repositorio, con permiso de escribir la rama descargas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: El historial, de la rama descargas
        run: |
          git fetch -q origin descargas:descargas 2>/dev/null || true
          mkdir -p historial
          if git show-ref --verify --quiet refs/heads/descargas; then
            git --work-tree=historial checkout descargas -- descargas.csv 2>/dev/null || true
          fi
      - name: Capturar el día
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/descargas.py capturar --csv historial/descargas.csv
      - name: Guardar en la rama descargas
        run: |
          cp historial/descargas.csv /tmp/descargas.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/heads/descargas; then
            git checkout descargas
          else
            git checkout --orphan descargas
            git rm -rf --quiet .
          fi
          cp /tmp/descargas.csv descargas.csv
          git add descargas.csv
          git diff --cached --quiet || git commit -m "Descargas al $(date -u +%F)"
          git push origin descargas
